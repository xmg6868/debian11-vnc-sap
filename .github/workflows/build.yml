name: Build Debian11 noVNC


on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

 build:

  runs-on: ubuntu-latest


  permissions:
    contents: read
    packages: write


  steps:


  - name: Checkout
    uses: actions/checkout@v4


  - name: Login GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}


  - name: Build
    run: |
      docker build \
      -t ghcr.io/${{ github.repository_owner }}/debian11-novnc-sap:latest .


  - name: Push
    run: |
      docker push \
      ghcr.io/${{ github.repository_owner }}/debian11-novnc-sap:latest
